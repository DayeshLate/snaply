spring.application.name=snaply-backend
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=8080
app.frontend.url=${FRONTEND_URL:}
app.backend.url=${BACKEND_URL:http://localhost:8080}

#Supabase Pooler Connection
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=${PG_SSLMODE:prefer}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.cache.type=redis

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=6000

# Mail
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Google Drive OAuth & API
google.drive.client-id=${GOOGLE_CLIENT_ID:}
google.drive.client-secret=${GOOGLE_CLIENT_SECRET:}
google.drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/drive/callback}
google.drive.scope=${GOOGLE_DRIVE_SCOPE:https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile openid}

# Logging
logging.level.org.springframework.web=INFO

# AI Vision & Embeddings Configuration
snaply.ai.provider=${AI_PROVIDER:gemini}
snaply.ai.gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
snaply.ai.gemini.vision-model=${GEMINI_VISION_MODEL:gemini-2.0-flash}
snaply.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
snaply.ai.openai.api-key=${OPENAI_API_KEY:}
snaply.ai.openai.vision-model=${OPENAI_VISION_MODEL:gpt-4o-mini}
snaply.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
snaply.ai.batch-size=${AI_BATCH_SIZE:10}
snaply.ai.max-retries=${AI_MAX_RETRIES:3}
snaply.ai.min-similarity=${AI_MIN_SIMILARITY:0.25}
snaply.ai.default-limit=${AI_DEFAULT_LIMIT:20}
snaply.ai.auto-index.enabled=${AI_AUTO_INDEX_ENABLED:true}
snaply.ai.auto-index.interval=${AI_AUTO_INDEX_INTERVAL:120000}

